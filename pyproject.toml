[project]
name = "ai-risk-manager"
version = "0.1.0"
description = "Multi-vector fraud detection platform for Indian BFSI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "AI Risk Manager Team", email = "team@ai-risk-manager.dev"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security :: Fraud Detection",
]
dependencies = [
    # Core ML/DS
    "torch>=2.3",
    "torchvision>=0.18",
    "torchaudio>=2.3",
    "lightgbm>=4.3",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    
    # Deep Learning
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.10",
    "timm>=1.0",
    "einops>=0.8",
    
    # Computer Vision
    "opencv-python>=4.10",
    "albumentations>=1.4",
    "kornia>=0.7",
    "pillow>=10.3",
    
    # Audio
    "librosa>=0.10",
    "torchaudio>=2.3",
    "speechbrain>=1.0",
    
    # Graph
    "torch-geometric>=2.5",
    "torch-sparse>=0.6",
    "networkx>=3.3",
    
    # Feature Store
    "feast>=0.40",
    "redis>=5.0",
    
    # Serving
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    
    # MLOps
    "mlflow>=2.14",
    "dvc>=3.48",
    "wandb>=0.17",
    
    # Data/Streaming
    "confluent-kafka>=2.5",
    "faust-streaming>=0.11",
    "pyarrow>=16.0",
    
    # Observability
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45",
    "opentelemetry-instrumentation-grpc>=0.45",
    "opentelemetry-exporter-otlp>=1.24",
    "structlog>=24.1",
    
    # Config
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    
    # Testing
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "hypothesis>=6.99",
    
    # Security
    "cryptography>=42.0",
    "pyjwt>=2.8",
    "passlib>=1.7",
    
    # Utils
    "tqdm>=4.66",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "pytest-xdist>=3.5",
    "bandit>=1.7",
    "safety>=3.0",
    "detect-secrets>=1.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
gpu = [
    "torch>=2.3+cu121",
    "torchvision>=0.18+cu121",
    "torchaudio>=2.3+cu121",
    "xgboost>=2.1",
    "lightgbm>=4.3",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "ERA", "PD", "PL", "TRY", "NPY", "RUF", "ARG", "TCH", "INT", "FUR", "LOG"]
ignore = ["S101", "S311", "S603", "S607"]
per-file-ignores = {
    "tests/*" = ["S101", "S311", "S603", "S607"],
    "scripts/*" = ["S603", "S607"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "adversarial: Adversarial robustness tests",
    "slow: Slow running tests",
    "gpu: Tests requiring GPU",
]

[tool.coverage.run]
source = ["libs", "services", "pipelines"]
omit = ["*/tests/*", "*/scripts/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "scripts", "docs"]
skips = ["B101", "B104", "B108", "B603", "B607"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"