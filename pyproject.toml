[project]
name = "ai-risk-manager"
version = "0.1.0"
description = "UPI Fraud Detector — Hackathon MVP (LightGBM + SHAP)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "AI Risk Manager Team", email = "team@ai-risk-manager.dev"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security :: Fraud Detection",
]
dependencies = [
    # Core ML/DS (CPU only)
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    
    # Explainability
    "shap>=0.44",
    
    # API serving
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    
    # Config
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    
    # Utils
    "tqdm>=4.66",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
]
gpu = [
    # For production TFT model (not used in MVP)
    "torch>=2.3",
    "torchvision>=0.18",
    "torchaudio>=2.3",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "ERA", "PD", "PL", "TRY", "NPY", "RUF", "ARG", "TCH", "INT", "LOG"]
ignore = ["S101", "S311", "S603", "S607"]
per-file-ignores = { "tests/*" = ["S101", "S311", "S603", "S607"], "scripts/*" = ["S603", "S607"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "asyncio: Async tests",
]

[tool.coverage.run]
source = ["services", "scripts"]
omit = ["*/tests/*", "*/scripts/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "scripts*"]
exclude = ["tests*", "infra*", "docker*", "models*", "configs*", "libs*", "pipelines*", "data*"]