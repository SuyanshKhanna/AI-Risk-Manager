version: '3.8'

services:
  # Minimal Postgres for local data storage
  postgres:
    image: postgres:16-alpine
    container_name: ai-risk-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_risk_manager
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d ai_risk_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  # UPI Fraud Detector API
  upi-fraud-detector:
    build:
      context: ..
      dockerfile: docker/upi_fraud_detector.Dockerfile
    container_name: ai-risk-upi-detector
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ../data:/app/data:ro
      - ../models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:

networks:
  default:
    name: ai-risk-network